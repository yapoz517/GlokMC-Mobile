name: GlokMC Mobile APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/PojavLauncher
          ref: v3_openjdk
          path: PojavLauncher
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Rebrand to GlokMC
        run: bash rebrand.sh PojavLauncher assets/icon.png

      - name: Build APK
        run: |
          cd PojavLauncher
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GlokMC-APK
          path: PojavLauncher/app_pojavlauncher/build/outputs/apk/debug/*.apk
