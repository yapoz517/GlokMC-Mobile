name: GlokMC Mobile APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/PojavLauncher
          ref: v3_openjdk
          path: PojavLauncher
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: sudo apt-get update && sudo apt-get install -y imagemagick

      - run: bash rebrand.sh PojavLauncher assets/icon.png

      - run: cd PojavLauncher && chmod +x gradlew && ./gradlew :app_pojavlauncher:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GlokMC-APK
          path: PojavLauncher/app_pojavlauncher/build/outputs/apk/debug/*.apk
