name: GlokMC Mobile APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: PojavLauncher indir
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules -b v3_openjdk https://github.com/PojavLauncherTeam/PojavLauncher.git PojavLauncher
          ls PojavLauncher
      - name: GlokMC markasi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=PojavLauncher/app_pojavlauncher/src/main/res
          for f in $RES/values*/strings.xml; do
            if [ -f "$f" ]; then
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">GlokMC</string>|' "$f"
            fi
          done
          ICON=icon.png
          [ -f "$ICON" ] || ICON=assets/icon.png
          if [ -f "$ICON" ]; then
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              dir=$RES/mipmap-${d%%:*}; sz=${d##*:}
              mkdir -p "$dir"
              convert "$ICON" -resize ${sz}x${sz} "$dir/ic_launcher.png"
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            done
            rm -f $RES/mipmap-anydpi*/ic_launcher*.xml
          else
            echo "icon.png yok, simge atlandi"
          fi
      - name: APK derle
        working-directory: PojavLauncher
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GlokMC-APK
          path: PojavLauncher/app_pojavlauncher/build/outputs/apk/debug/*.apk
